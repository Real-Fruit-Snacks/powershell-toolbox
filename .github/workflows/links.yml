name: links

# Links in the README, the docs and the project page. Monthly too, because the pages they point at
# move without this repo changing.
on:
  push:
    branches: [main]
    paths: ['**.md', 'docs/**.html']
  schedule:
    - cron: '23 6 4 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 4 --retry-wait-time 10 --timeout 30
            --accept 200,206,429
            --exclude '^https://github\.com/Real-Fruit-Snacks/powershell-toolbox/(issues/new|security/advisories/new)'
            './**/*.md' 'docs/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
