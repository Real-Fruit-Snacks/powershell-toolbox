name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.shell }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, shell: powershell }
          - { os: windows-latest, shell: pwsh }
          - { os: ubuntu-latest, shell: pwsh }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: $PSVersionTable | Format-Table -AutoSize | Out-String -Width 200

      - name: Install Pester and PSScriptAnalyzer
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          # The PowerShell Gallery drops a download now and then ("failed to download").
          # Try each module up to 4 times, 10/20/30 s apart, before failing the job.
          $modules = @(
            @{ Name = 'Pester'; Version = '5.7.1' },
            @{ Name = 'PSScriptAnalyzer'; Version = '1.25.0' }
          )
          foreach ($m in $modules) {
            for ($try = 1; $true; $try++) {
              try {
                Install-Module $m.Name -RequiredVersion $m.Version -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
                Write-Host "Installed $($m.Name) $($m.Version) (try $try)"
                break
              } catch {
                if ($try -ge 4) { throw }
                Write-Warning "Installing $($m.Name) failed (try $try): $_"
                Start-Sleep -Seconds (10 * $try)
              }
            }
          }

      - name: Lint
        run: |
          $found = Invoke-ScriptAnalyzer -Path . -Settings ./PSScriptAnalyzerSettings.psd1
          $found | Format-Table -AutoSize | Out-String -Width 200
          if ($found) { exit 1 }

      - name: Test
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $c = New-PesterConfiguration
          $c.Run.Path = './tests'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c
