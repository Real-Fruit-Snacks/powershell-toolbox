name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.shell }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, shell: powershell }
          - { os: windows-latest, shell: pwsh }
          - { os: ubuntu-latest, shell: pwsh }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5

      - name: Versions
        run: $PSVersionTable | Format-Table -AutoSize | Out-String -Width 200

      - name: Install Pester and PSScriptAnalyzer
        run: |
          # The PowerShell Gallery is flaky from hosted runners in two ways: a download fails
          # ("failed to download"), or the gallery was unreachable when PowerShellGet first
          # loaded, so PSGallery is not registered at all ("No repository with the name
          # 'PSGallery' was found"). Each try re-registers the gallery if it is missing, then
          # installs. 5 tries, 15/30/45/60 s apart, before failing the job.
          $modules = @(
            @{ Name = 'Pester'; Version = '5.7.1' },
            @{ Name = 'PSScriptAnalyzer'; Version = '1.25.0' }
          )
          foreach ($m in $modules) {
            for ($try = 1; $true; $try++) {
              try {
                if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
                  Write-Host 'PSGallery is not registered; registering it'
                  Register-PSRepository -Default -ErrorAction Stop
                }
                Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction Stop
                Install-Module $m.Name -RequiredVersion $m.Version -Repository PSGallery -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
                Write-Host "Installed $($m.Name) $($m.Version) (try $try)"
                break
              } catch {
                if ($try -ge 5) { throw }
                Write-Warning "Installing $($m.Name) failed (try $try): $_"
                Start-Sleep -Seconds (15 * $try)
              }
            }
          }

      - name: Lint
        run: |
          $found = Invoke-ScriptAnalyzer -Path . -Settings ./PSScriptAnalyzerSettings.psd1
          $found | Format-Table -AutoSize | Out-String -Width 200
          if ($found) { exit 1 }

      - name: Test
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $c = New-PesterConfiguration
          $c.Run.Path = './tests'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c
